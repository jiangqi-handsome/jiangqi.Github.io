<!DOCTYPE html>
<html id="v-html" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 1、定义浅色主题 */
        :root {
            --bg-color: #fff;
            --text-color: #333;
            --btn-bg: #42b983;
            --bg-text: #fff;
        }

        /* 2、定义深色主题 */
        .dark-theme {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --btn-bg: #666;
            --btn-text: #fff;
        }

        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 元素标签样式表 + var(--xxx) */
        body {
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            transition: all 0.3s ease; /* 给切换主题加平滑过渡 */
            font-family: 'Courier New', Courier, monospace;

            &>.container {
                max-width: 600px;
                margin: 0 auto;

                &>p {
                    display: flex;
                    width: 800px;
                    height: 400px;
                    font-size: 24px;
                    font-weight: bold;
                    align-items: center;
                    justify-content: center;
                }

                &>#themeToggle {
                    padding: 0.8rem 1.5rem;
                    border: none;
                    border-radius: 4px;
                    background: var(--btn-bg);
                    color: var(--btn-text);
                    cursor: pointer;
                    transition: background 0.3s ease; /* 切换时背景有0.3秒，而不一瞬间切换 */

                    &:hover {
                        opacity: 0.9;
                    }
                }
            }
        }
    </style>
</head>

<body>
    <!-- html -->
    <div class="container">
        <h1>主题切换HTML + CSS + JavaScript</h1>
        <p>春王正月，齐人迁阳。夏五月乙酉，吉禘于庄公。秋八月辛丑，公薨。九月，夫人姜氏孙于邾。公子庆父出奔莒。冬，齐高子来盟。十有二月，狄入卫。郑弃其师。</p>
        <button id="themeToggle">切换主题</button>
    </div>

    <!-- JavaScript -->
    <script>
        /**
         * html + css + javaScript实现主题切换的逻辑：
         * 1、给根元素添加类名，遵循“先写后用，后写先用，的css规则
         * 2、在两套根元素root当中进行切换，重点是在给第二个root添加一个类名。
         * 3、root是给根元素的，不管在什么地方root，他都指向html元素。
         * 4、重点：“root声明的值是可以被继承的，意思就是他会往下传” html -- div -- p
        */

        // 获取元素，用id获取
        const toggleBtn = document.getElementById('themeToggle');
        const html = document.getElementById('v-html');

        // 初始化：从localStorage读取上次主题
        function initTheme() {

            // 这里声明的意思呢，就是将这个词存储于本地，可以在控制台中看到
            const savedTheme = localStorage.getItem('theme');

            // 1、这里的判断表示，如果页面中的样式是严格相等，那么就执行判断题里面的添加类名。
            // 2、这里的判断表示，如果页面中的样式是严格不相等，跳出这个判断不做任何改变。
            // 3、第2的这个bug需要后面好好研究，因为它不能同时出现两种状态
            if (savedTheme === 'dark') {
                html.classList.add('dark-theme');
            }
        }

        // 切换主题
        function toggleTheme() {

            // 对根元素进行样式切换
            const isDark = html.classList.toggle('dark-theme');

            // 保存到localStorage
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // 绑定事件
        toggleBtn.addEventListener('click', toggleTheme);

        // 页面加载时初始化
        initTheme();
    </script>
</body>

</html>
