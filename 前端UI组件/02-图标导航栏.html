<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图标导航栏</title>

    <!-- ========== 添加图标库 ========== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- ========== 全局样式表 ========== -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

    <!-- 
    * 在代码中有两个样式表，我用住是已经隔开，只能使用其中一个不然的话他最后获取的也只是水平垂直的不复生效。
    * 重点两套样式表中只能用一套。不然，最后只有水平方向，没有垂直方向
    -->

    <style>
        /* ========== 垂直样式表 ========== */

        .icon-bar {
            width: 90px;
            background-color: #555;
        }

        .icon-bar a {
            display: block;
            text-align: center;
            padding: 16px;
            transition: all 0.3s ease;
            color: white;
            font-size: 36px;
        }

        .icon-bar a:hover {
            background-color: #000;
        }

        .active {
            background-color: #04AA6D;
        }

    </style>

    <style>
        /* ========== 水平样式表 ========== */
        .icon-bar {
            display: flex;
            margin: 0 auto;
            align-items: center;
            justify-content: center;
            max-width: 800px;
            width: 100%;
            background-color: #555;
            overflow: auto;
        }

        .icon-bar a {
            text-align: center;
            width: 20%;
            padding: 12px 0;
            transition: all 0.3s ease;
            color: white;
            font-size: 36px;
        }

        .icon-bar a:hover {
            background-color: #000;
        }

        .active {
            background-color: #04aa6d;
        }
    </style>
</head>
<body>
    <div class="icon-bar">
        <a href="#" class="active"><i class="fa fa-home"></i></a>
        <a href="#"><i class="fa fa-search"></i></a>
        <a href="#"><i class="fa fa-envelope"></i></a>
        <a href="#"><i class="fa fa-globe"></i></a>
        <a href="#"><i class="fa fa-trash"></i></a>
    </div>
</body>
</html>
