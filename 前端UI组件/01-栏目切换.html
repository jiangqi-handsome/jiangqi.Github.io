<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栏目切换效果</title>
    <style>
        /* ========== 全局样式表 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== 栏目切换样式表 ========== */
        /* <--- 样式可以自己发挥，就是说自己喜欢什么样式就写成什么样。---> */
        .tab-container {
            width: 100%;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .tab-header {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .tab-button {
            flex: 1;
            font-weight: 500;
            padding: 15px;
            color: #333;
            text-align: center;
            background: #f1f1f1;
            border: none;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-button.active {
            background: #007bff;
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="tab-container">
        <ul class="tab-header">
            <li data-content="tab1" class="tab-button active">tab 1</li>
            <li data-content="tab2" class="tab-button">tab 2</li>
            <li data-content="tab3" class="tab-button">tab 3</li>
        </ul>
        <div class="tab-content active" id="tab1">
            <h1>tab 1 Content</h1>
            <p>Lorem ipsum dolor sit amet.</p>
        </div>
        <div class="tab-content" id="tab2">
            <h1>tab 2 Content</h1>
            <p>Quaerat nesciunt excepturi et voluptatum!</p>
        </div>
        <div class="tab-content" id="tab3">
            <h1>tab 3 Content</h1>
            <p>Sunt incidunt optio placeat porro.</p>
        </div>
    </div>
    
    <!--  -->
    <!--  -->
    <!--  -->
    <!--  -->
    <!--  -->
    <!-- js -->
    <script>
        const tabButton = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');
        const tabHeader = document.querySelector('.tab-header');
        
        tabHeader.onclick = function (e) {
            let target = e.target;
            
            if (target.tagName !== "LI" || target.classList.contains('active')) {
                return;
            }

            tabButton.forEach(function (button) {
                button.classList.remove('active');
            });

            tabContents.forEach(function (content) {
                content.classList.remove('active');
            });

            target.classList.add('active');

            document.getElementById(target.dataset.content).classList.add('active');
        }
    </script>
</body>
</html>
