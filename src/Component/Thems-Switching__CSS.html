<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /**
        * 1、html + CSS制作主题切换
        * 2、在这里运用到了，伪类和同级选择符：:checked + ~
        * 3、默认使用root这一套给根元素，如果需要改成深色需要第二个的条件进行
        * 4、需要使用元素 <input type="checkbox" id="xxx-xxx"> 该元素是一个复选框，来进行二者切换（二态开关）
        * 5、还需要一个文本元素 <label for="xxx-xxx" class="xxx-xxx">切换主题</label> 该元素是用给复选框添加说明，也就是文本、也可以点击
        *
        * 6、重点：伪类（ :checked ）触发 + 兄弟选择器（ ~ ）选平级 + 选择器权重生效
        *        - 触发源：复选框的 checked 伪类（二态开关）；
        *        - 作用对象：和复选框平级的目标元素（div/body/html，你选的哪个平级，就给哪个加主题样式）；
        *        - 生效关键：选择器的权重比默认样式高，才能覆盖默认主题。
        */

        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 1、定义主题变量 + 默认浅色主题 */
        :root {
            --bg-color: #fff;
            --text-color: #333;
            --btn-bg: #42b983;
            --bg-text: #fff;
            --card-bg: #f5f5f5;
        }

        /* 2、定义深色主题（可以通过checked触发） */
        #theme-switch:checked~.app {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --btn-bg: #666;
            --btn-text: #fff;
            --card-bg: #2d2d2d;
        }

        /* 3、隐藏原生复选框开关 */
        #theme-switch {
            display: none;
        }

        /* 4、自定义主题开关按钮（label绑定开关） */
        .theme-toggle {
            display: inline-block;
            padding: 8px 16px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border-radius: 4px;
            cursor: pointer;
            margin: 20px;
            user-select: none;
            /* 禁止文字选中 */

            /* 添加hover伪类 */
            &:hover {
                opacity: 0.9;
            }
        }

        /* 5、页面容器：承载所有主题样式 */
        .app {
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            transition: background 0.3s ease;
            font-family: 'Courier New', Courier, monospace;

            &>.test-card {
                width: 800px;
                height: 400px;
                background: var(--bg-color);
                transition: background 0.3s ease;
                margin: 20px auto;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 24px;
            }
        }

        /* @media查询是用来，做自动根据系统的主题的决定 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #222;
                --text: #eee;
            }
        }
    </style>
</head>

<body>
    <!-- 核心：开关复选框 + 自定义按钮 + 页面根容器 -->
    <!-- for和id绑定，点击label等价于点击input -->
    <input type="checkbox" id="theme-switch">
    <div class="app">
        <label for="theme-switch" class="theme-toggle">切换主题</label>
        <h1>纯CSS主题切换演示</h1>
        <p>没有使用javascript</p>
        <div class="test-card">“泰伯，其可谓至德也已矣。三以天下让，民无得而称焉。”</div>
    </div>
</body>

</html>
