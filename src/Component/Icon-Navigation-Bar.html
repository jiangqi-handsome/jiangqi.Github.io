<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图标导航栏</title>

    <!-- ============================================================
         引入 Font Awesome 图标库
         ============================================================
         使用 CDN 方式加载 Font Awesome 4.7.0，
         这样就可以通过 <i class="fa fa-xxx"></i> 使用各种图标了。
    ============================================================ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- ============================================================
         全局样式重置
         ============================================================
         清除浏览器默认的外边距和内边距，统一盒模型为 border-box，
         确保元素宽高计算包含内边距和边框，避免布局偏差。
    ============================================================ -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

    <!-- 
        注意：以下有两套样式表（垂直 / 水平），使用时只能启用其中一套，
        否则由于选择器相同，后面的样式会覆盖前面的，导致只有水平方向生效。
        想切换方向时，把不用的那套注释掉即可。
    -->

    <!-- ============================================================
         垂直样式表（左侧竖排图标导航栏）
         ============================================================
         图标从上到下垂直排列，整体宽度固定为 90px，
         适合放在页面左侧作为侧边栏导航。
    ============================================================ -->
    <style>
        /* 导航栏容器：固定宽度，深灰色背景 */
        .icon-bar {
            width: 90px;
            background-color: #555;
        }

        /* 每个图标链接：块级元素独占一行，文字居中，白色大号图标 */
        .icon-bar a {
            display: block;
            /* 独占一行，可设置宽高内边距 */
            text-align: center;
            padding: 16px;
            transition: all 0.3s ease;
            /* 鼠标悬停时有平滑过渡效果 */
            color: white;
            font-size: 36px;
            /* 图标大小 */
        }

        /* 鼠标悬停时背景变黑 */
        .icon-bar a:hover {
            background-color: #000;
        }

        /* 激活状态（当前选中项）：绿色背景 */
        .active {
            background-color: #04AA6D;
        }
    </style>

    <!-- ============================================================
         水平样式表（顶部横排图标导航栏）
         ============================================================
         图标从左到右水平排列，整体居中，最大宽度 800px，
         适合放在页面顶部作为主导航。
    ============================================================ -->
    <style>
        /* 导航栏容器：flex 水平布局，居中显示，深灰色背景 */
        .icon-bar {
            display: flex;
            /* 子元素水平排列 */
            margin: 0 auto;
            /* 水平居中 */
            align-items: center;
            /* 垂直方向居中对齐 */
            justify-content: center;
            /* 水平方向居中对齐 */
            max-width: 800px;
            /* 最大宽度 */
            width: 100%;
            /* 占满可用宽度 */
            background-color: #555;
            overflow: auto;
            /* 内容过多时出现滚动条 */
        }

        /* 每个图标链接：平分宽度（各占 20%），文字居中，白色大号图标 */
        .icon-bar a {
            text-align: center;
            width: 20%;
            /* 5 个图标，每个占 20% 宽度 */
            padding: 12px 0;
            transition: all 0.3s ease;
            color: white;
            font-size: 36px;
        }

        /* 鼠标悬停时背景变黑 */
        .icon-bar a:hover {
            background-color: #000;
        }

        /* 激活状态（当前选中项）：绿色背景 */
        .active {
            background-color: #04aa6d;
        }
    </style>
</head>

<body>
    <!-- ============================================================
         图标导航栏结构
         ============================================================
         - 5 个图标链接，分别是：首页、搜索、邮件、地球、垃圾桶
         - 第一个默认带有 active 类，表示当前选中状态
         - 使用 Font Awesome 图标类：fa-home / fa-search / fa-envelope 等
    ============================================================ -->
    <div class="icon-bar">
        <a href="#" class="active"><i class="fa fa-home"></i></a> <!-- 首页图标，默认选中 -->
        <a href="#"><i class="fa fa-search"></i></a> <!-- 搜索图标 -->
        <a href="#"><i class="fa fa-envelope"></i></a> <!-- 邮件图标 -->
        <a href="#"><i class="fa fa-globe"></i></a> <!-- 地球图标 -->
        <a href="#"><i class="fa fa-trash"></i></a> <!-- 垃圾桶图标 -->
    </div>
</body>

</html>
